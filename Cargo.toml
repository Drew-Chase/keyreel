[package]
name = "key_reel"
version = "0.1.0"
edition = "2024"
description = "Portable Windows screen recorder that logs keystrokes to a subtitle track and records system + microphone audio"

[dependencies]
# Screen capture (Windows.Graphics.Capture)
windows-capture = "2"

# System audio (WASAPI loopback) and microphone capture
wasapi = "0.26"

# Keyboard hook, QPC timestamps, and the Media Foundation sink writer
# (H.264 + two AAC tracks muxed into one MP4)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
] }

# Raw key log (.jsonl)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true